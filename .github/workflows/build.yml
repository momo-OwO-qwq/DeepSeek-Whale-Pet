name: Build packages

on:
  push:
    tags:
      - 'v*'
      - 'ver-*'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  linux:
    name: Linux (x64 / arm64 / armv7l)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # --publish never：跳过 electron-builder 对 GitHub 的发布交互（防止 403）
      - name: Build AppImage + deb + rpm + tar.gz (x64 / arm64 / armv7l)
        run: npx electron-builder --linux --x64 --arm64 --armv7l --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  windows:
    name: Windows (x64 / arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Build Windows NSIS (x64 / arm64)
        run: npx electron-builder --win --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe

  # ------- 发布（ver- 标签：名称=产品名 版本；正文=变更清单 + 校验表） -------
  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build release body (Commits + Checksums)
        shell: bash
        run: |
          # 该步骤仅生成发布正文：任何命令失败都不应让整个 job 失败
          set +e
          VERSION="${GITHUB_REF_NAME#ver-}"; VERSION="${VERSION#v}"
          PRODUCT=$(node -p "require('./package.json').productName" 2>/dev/null)
          [ -n "$PRODUCT" ] || PRODUCT="deepseek-whale-linux"
          RELEASE_NAME="${PRODUCT} ${VERSION}"

          git fetch --tags --quiet 2>/dev/null
          PREV=$(git tag --list 'v*' 'ver-*' 2>/dev/null | grep -v "^${GITHUB_REF_NAME}$" | sort -V | tail -1)
          COMMITS=""
          if [ -n "$PREV" ]; then COMMITS=$(git log --oneline --no-decorate "$PREV"..HEAD 2>/dev/null); fi
          [ -n "$COMMITS" ] || COMMITS=$(git log --oneline --no-decorate -20 2>/dev/null)
          [ -n "$COMMITS" ] || COMMITS="(no commits)"

          {
            echo "### 📜 Commits:"
            echo
            echo "$COMMITS" | sed 's/^/- /'
            echo
            echo "### 🔒 Checksums"
            echo
            echo "| artifact | MD5 | SHA256 |"
            echo "| --- | --- | --- |"
            for f in artifacts/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              md5=$(md5sum "$f" 2>/dev/null | cut -d' ' -f1)
              sha=$(sha256sum "$f" 2>/dev/null | cut -d' ' -f1)
              echo "| $name | $md5 | $sha |"
            done
            echo
            echo "> [!WARNING]"
            echo "> 桌宠为本地应用，请从可信渠道下载并核对上方校验值。"
          } > body.md 2>/dev/null
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"
          cat body.md
          exit 0
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: body.md
          files: artifacts/*
          generate_release_notes: false
