name: Build Linux packages

on:
  push:
    tags:
      - 'v*'
      - 'ver-*'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  linux:
    name: Linux (x64 / arm64 / armv7l)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # --publish never：跳过 electron-builder 对 GitHub 的发布交互（防止 403）
      - name: Build AppImage + deb + rpm + tar.gz (x64 / arm64 / armv7l)
        run: npx electron-builder --linux --x64 --arm64 --armv7l --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  # ------- 发布（ver- 标签：名称=产品名 版本；正文=变更清单 + 校验表） -------
  release:
    name: Publish GitHub Release
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build release body (Commits + Checksums)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#ver-}"; VERSION="${VERSION#v}"
          PRODUCT=$(node -p "require('./package.json').productName")
          RELEASE_NAME="${PRODUCT} ${VERSION}"

          git fetch --tags --quiet
          # 取上一个版本标签（排除当前标签）；没有则回退到近期提交
          # 注意：禁止用空值/自身造成 git log 报错，避免 set -e/pipefail 直接失败
          PREV=$(git tag --list 'v*' 'ver-*' | grep -v "^${GITHUB_REF_NAME}$" | sort -V | tail -1 || true)
          if [ -n "$PREV" ] && git rev-parse --verify "$PREV" >/dev/null 2>&1; then
            COMMITS=$(git log --oneline --no-decorate "$PREV"..HEAD 2>/dev/null || true)
          else
            COMMITS=""
          fi
          if [ -z "$COMMITS" ]; then COMMITS=$(git log --oneline --no-decorate -20 || true); fi

          {
            echo "### 📜 Commits:"
            echo
            echo "$COMMITS" | sed 's/^/- /'
            echo
            echo "### 🔒 Checksums"
            echo
            echo "| artifact | MD5 | SHA256 |"
            echo "| --- | --- | --- |"
            for f in artifacts/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              md5=$(md5sum "$f" | cut -d' ' -f1)
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              echo "| $name | $md5 | $sha |"
            done
            echo
            echo "> [!WARNING]"
            echo "> 桌宠为本地应用，请从可信渠道下载并核对上方校验值。"
          } > body.md
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"
          sed -n '1,20p' body.md
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: body.md
          files: artifacts/*
          generate_release_notes: false
