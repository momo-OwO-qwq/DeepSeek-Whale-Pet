name: Build packages (all platforms)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---------- Linux：x64 + arm64 ----------
  linux:
    name: Linux (x64 / arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Build x64 (AppImage + deb)
        run: npx electron-builder --linux --x64
      - name: Build arm64 (AppImage + deb)
        run: npx electron-builder --linux --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb

  # ---------- macOS：Universal (x64 + arm64) ----------
  mac:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Build macOS (Universal dmg + zip)
        run: npx electron-builder --mac --universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/*.dmg
            dist/*.zip

  # ---------- Windows：x64 ----------
  win:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Build Windows (nsis + zip)
        run: npx electron-builder --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            dist/*.zip

  # ---------- 合并发布（标签推送时） ----------
  release:
    name: Attach to GitHub Release
    needs: [linux, mac, win]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
